name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -o .github/workflows/app.zip
      - run: mkdir -p ~/.android && cp debug.keystore ~/.android/debug.keystore
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npx cap add android
      - run: sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
      - run: if [ -f resources/icon.png ]; then npx @capacitor/assets generate --android; fi
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/debug.keystore -Pandroid.injected.signing.store.password=android -Pandroid.injected.signing.key.alias=androiddebugkey -Pandroid.injected.signing.key.password=android
      - name: Verify signing
        continue-on-error: true
        run: |
          AP=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          keytool -list -keystore debug.keystore -storepass android | tail -2
          $AP/apksigner verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk | head -3
          $AP/aapt dump badging android/app/build/outputs/apk/debug/app-debug.apk | head -1
      - uses: actions/upload-artifact@v4
        with:
          name: NutriTrack-APK-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
